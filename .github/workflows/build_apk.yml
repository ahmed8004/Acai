name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Get Flutter dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons
    
    - name: Check APK exists
      run: |
        ls -la build/app/outputs/flutter-apk/
        cp build/app/outputs/flutter-apk/app-release.apk ac-ai-v1.0.0.apk || true
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ac-ai-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: warn
    
    - name: Create Release
      if: github.ref == 'refs/heads/main' && success()
      uses: ncipollo/release-action@v1
      with:
        artifacts: build/app/outputs/flutter-apk/app-release.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: v1.0.${{ github.run_number }}
        name: AC AI v1.0.${{ github.run_number }}
        body: |
          AC AI Android Technical Power User Assistant
          
          Features:
          - Wake word detection ("Hey AC")
          - Voice commands in Hindi, English, Hinglish
          - AI-powered responses via Groq
          - File management and automation
          - Termux integration
          - USB device monitoring
          - Document intelligence (PDF, images)
          - Device control (calls, SMS, WiFi, Bluetooth)
          
          Download the APK from below.
        draft: false
        prerelease: false
        allowUpdates: true
        makeLatest: true
