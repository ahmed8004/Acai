name: ac_ai
description: AC AI - Android Technical Power User Assistant
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Networking
  dio: ^5.4.0
  http: ^1.1.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Voice & Speech
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5
  
  # Platform Services
  permission_handler: ^11.1.0
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  awesome_notifications: ^0.8.2
  
  # File Operations
  file_picker: ^6.1.1
  open_filex: ^4.3.4
  image_picker: ^1.0.7
  image: ^4.1.3
  pdf: ^3.10.4
  syncfusion_flutter_pdf: ^24.1.41
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  flutter_staggered_animations: ^1.1.1
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  encrypt: ^5.0.1
  
  # Background Services
  workmanager: ^0.5.2
  
  # Accessibility
  accessibility_tools: ^2.0.0
  
  # URL Launcher
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Logging
  logger: ^2.0.2
  
  # Document Processing
  flutter_pdfview: ^1.3.2
  
  # OCR - ML Kit packages with compatible versions
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_object_detection: ^0.12.0
  google_mlkit_image_labeling: ^0.12.0
  
  # USB
  usb_serial: ^0.5.1
  
  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # Vibration
  vibration: ^1.8.4
  
  # Sensors
  sensors_plus: ^4.0.2
  
  # Geolocation
  geolocator: ^10.1.0
  
  # Contacts - Using native implementation
  # contacts_service: ^0.6.3
  
  # Phone
  flutter_phone_direct_caller: ^2.1.1
  
  # Battery
  battery_plus: ^5.0.2
  
  # Volume
  volume_controller: ^2.0.7
  
  # Brightness
  screen_brightness: ^0.2.2
  
  # Network
  network_info_plus: ^4.1.0
  
  # Archive
  archive: ^3.4.9
  
  # Mime Type
  mime: ^1.0.4
  
  # Time
  jiffy: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_lint: ^2.3.7
  custom_lint: ^0.5.7
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/models/
    - assets/sounds/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
