// See android/settings.gradle for plugin configuration.

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.picovoice.ai/repository/maven-releases/' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
